name: consumer-patch-qa
on:
  push:
    branches: ["devin/*-candidate-qa"]
  workflow_dispatch:
permissions:
  contents: read
env:
  APP_SHA: 1a4c51e36622cfc67534860b689c70e37a9ea8d5
jobs:
  build:
    name: Build and constrain the documentation-only candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.compare.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify pinned product source
        run: |
          git fetch --quiet origin "$APP_SHA"
          git diff --exit-code "$APP_SHA" HEAD -- . ':(exclude)qa' ':(exclude).github/workflows/consumer-patch-qa.yml'
      - uses: ./.github/actions/setup
        with:
          node-version: "24.20.0"
      - name: Verify evidence-gate behavior
        run: node --test qa/consumer/result-gate.test.mjs
      - name: Build and pack
        run: |
          pnpm build
          mkdir -p "$RUNNER_TEMP/candidate"
          pnpm --filter @npmmo/roster pack --pack-destination "$RUNNER_TEMP/candidate"
      - name: Require unchanged runtime and constrained metadata differences
        id: compare
        run: node qa/consumer/compare-candidate.mjs "$RUNNER_TEMP/candidate/npmmo-roster-0.0.2.tgz"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: candidate-0.0.2
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 30
  consumers:
    name: Candidate 0.0.2 · ${{ matrix.platform }} node${{ matrix.node }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CANDIDATE_SHA256: ${{ needs.build.outputs.sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, node: "22.17.0" }
          - { os: ubuntu-latest, platform: linux, node: "24.20.0" }
          - { os: windows-latest, platform: windows, node: "22.17.0" }
          - { os: windows-latest, platform: windows, node: "24.2.0" }
          - { os: windows-latest, platform: windows, node: "24.20.0" }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v7
        with:
          name: candidate-0.0.2
          path: ${{ runner.temp }}/candidate
      - name: Linux tracing tools
        if: matrix.platform == 'linux'
        shell: bash
        run: command -v strace || (sudo apt-get update -qq && sudo apt-get install -y strace)
      - name: Exact-artifact consumers and real version upgrade
        id: qa
        continue-on-error: true
        run: |
          $tarball = "$env:RUNNER_TEMP/candidate/npmmo-roster-0.0.2.tgz"
          $hash = (Get-FileHash -Algorithm SHA256 $tarball).Hash.ToLower()
          if ($hash -ne $env:CANDIDATE_SHA256) { throw "candidate hash mismatch" }
          $qaExit = 1
          try {
            node qa/consumer/staging-registry.mjs start --dir "$env:RUNNER_TEMP/staging-registry" --port 4873 --tarball "$tarball"
            if ($LASTEXITCODE -ne 0) { throw "staging registry startup failed" }
            node qa/consumer/consumer-qa.mjs --out "$env:RUNNER_TEMP/qa-out" --tarball "$tarball" --registry http://127.0.0.1:4873/ --node-label "${{ matrix.node }}" --repo "$env:GITHUB_WORKSPACE" --dense
            $qaExit = $LASTEXITCODE
          } finally {
            node qa/consumer/staging-registry.mjs stop --dir "$env:RUNNER_TEMP/staging-registry"
          }
          "exit_code=$qaExit" >> $env:GITHUB_OUTPUT
          exit $qaExit
      - name: Collect safe evidence
        if: always()
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/qa-out/registry" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/candidate/comparison.json" "$env:RUNNER_TEMP/qa-out/comparison.json"
          foreach ($file in @("registry-summary.json", "verdaccio.log", "verdaccio.out")) {
            $source = "$env:RUNNER_TEMP/staging-registry/$file"
            if (Test-Path $source) { Copy-Item $source "$env:RUNNER_TEMP/qa-out/registry/$file" }
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: candidate-consumer-${{ matrix.platform }}-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/qa-out/results.json
            ${{ runner.temp }}/qa-out/env.json
            ${{ runner.temp }}/qa-out/comparison.json
            ${{ runner.temp }}/qa-out/cases
            ${{ runner.temp }}/qa-out/registry
          if-no-files-found: error
          retention-days: 30
      - name: Require complete evidence including the version upgrade
        if: always()
        run: node qa/consumer/result-gate.mjs "$env:RUNNER_TEMP/qa-out/results.json"
