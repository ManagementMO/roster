name: dense-portability-qa
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/coach/**'
      - 'packages/cli/**'
      - 'scripts/verify-dense-consumer.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/actions/setup/**'
      - '.github/workflows/dense-portability-qa.yml'
permissions:
  contents: read
concurrency:
  group: dense-portability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.identity.outputs.sha256 }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: '24.20.0'
      - run: pnpm --filter @npmmo/roster pack --pack-destination "$RUNNER_TEMP/candidate"
      - id: identity
        shell: bash
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          mv "$RUNNER_TEMP/candidate/npmmo-roster-$version.tgz" "$RUNNER_TEMP/candidate/package.tgz"
          digest=$(sha256sum "$RUNNER_TEMP/candidate/package.tgz" | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$digest  @npmmo/roster@$version"
      - uses: actions/upload-artifact@v6
        with:
          name: portability-candidate
          path: ${{ runner.temp }}/candidate/package.tgz
          if-no-files-found: error
          retention-days: 30
  native:
    name: Dense · ${{ matrix.id }}
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { id: linux-x64-node22, os: ubuntu-24.04, node: '22.17.0', backend: native }
          - { id: linux-x64-node24, os: ubuntu-24.04, node: '24.20.0', backend: native }
          - { id: linux-arm64-node24, os: ubuntu-24.04-arm, node: '24.20.0', backend: native, upgrade: '0.0.2' }
          - { id: linux-arm64-node26, os: ubuntu-26.04-arm, node: '26.8.1', backend: native }
          - { id: macos-intel-node22, os: macos-15-intel, node: '22.23.2', backend: wasm }
          - { id: macos-intel-node24, os: macos-26-intel, node: '24.20.0', backend: wasm, upgrade: '0.0.3' }
          - { id: macos-arm64-node24, os: macos-15, node: '24.20.0', backend: native }
          - { id: macos-arm64-node26, os: macos-26, node: '26.8.1', backend: native }
          - { id: windows-x64-node22, os: windows-2025, node: '22.17.0', backend: native }
          - { id: windows-x64-node24-min, os: windows-2025, node: '24.2.0', backend: native }
          - { id: windows-x64-node24, os: windows-2025, node: '24.20.0', backend: native, upgrade: '0.0.3' }
          - { id: windows-arm64-node24, os: windows-11-arm, node: '24.20.0', backend: native, upgrade: '0.0.3' }
          - { id: windows-arm64-node26, os: windows-11-arm, node: '26.8.1', backend: native }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v7
        with:
          name: portability-candidate
          path: ${{ runner.temp }}/candidate
      - name: Verify installed product and real dense backfill
        shell: bash
        env:
          EXPECTED_PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
          ROSTER_UPGRADE_FROM: ${{ matrix.upgrade || '' }}
        run: node scripts/verify-dense-consumer.mjs "$RUNNER_TEMP/candidate/package.tgz" "$RUNNER_TEMP/dense-results" "${{ needs.pack.outputs.sha256 }}" "${{ matrix.backend }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dense-${{ matrix.id }}
          path: ${{ runner.temp }}/dense-results
          if-no-files-found: error
          retention-days: 30
  alpine:
    name: Dense + offline · ${{ matrix.arch }} node${{ matrix.node }}
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04, node: '22', image: 'node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32' }
          - { arch: arm64, os: ubuntu-24.04-arm, node: '22', image: 'node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32' }
          - { arch: amd64, os: ubuntu-24.04, node: '24', image: 'node@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf', upgrade: '0.0.3' }
          - { arch: arm64, os: ubuntu-24.04-arm, node: '24', image: 'node@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf', upgrade: '0.0.3' }
          - { arch: amd64, os: ubuntu-24.04, node: '26', image: 'node@sha256:2d984a15c9b54fd0aeb608b8e0d0d83529eb34d2966db27a1fb4f1edc3d298a3' }
          - { arch: arm64, os: ubuntu-24.04-arm, node: '26', image: 'node@sha256:2d984a15c9b54fd0aeb608b8e0d0d83529eb34d2966db27a1fb4f1edc3d298a3' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: portability-candidate
          path: ${{ runner.temp }}/candidate
      - name: Install and infer as an unprivileged stock-Alpine consumer
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name roster-portability --platform linux/${{ matrix.arch }} --memory 4g --cpus 2 --user node --env EXPECTED_PACKAGE_VERSION='${{ needs.pack.outputs.version }}' --env ROSTER_UPGRADE_FROM='${{ matrix.upgrade || '' }}' \
            --mount type=bind,source="$GITHUB_WORKSPACE/scripts/verify-dense-consumer.mjs",target=/verify.mjs,readonly \
            --mount type=bind,source="$RUNNER_TEMP/candidate/package.tgz",target=/candidate.tgz,readonly \
            '${{ matrix.image }}' sleep infinity
          docker exec roster-portability node /verify.mjs /candidate.tgz /tmp/online '${{ needs.pack.outputs.sha256 }}' wasm
      - name: Cold-process inference after network removal
        shell: bash
        run: |
          set -euo pipefail
          root=$(docker exec roster-portability node -p 'require("/tmp/online/result.json").root')
          docker network disconnect bridge roster-portability
          docker exec roster-portability node /verify.mjs /candidate.tgz /tmp/offline '${{ needs.pack.outputs.sha256 }}' wasm "$root"
      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dense-results"
          docker cp roster-portability:/tmp/online "$RUNNER_TEMP/dense-results/" || true
          docker cp roster-portability:/tmp/offline "$RUNNER_TEMP/dense-results/" || true
          docker inspect roster-portability > "$RUNNER_TEMP/dense-results/container.json" || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dense-alpine-${{ matrix.arch }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/dense-results
          if-no-files-found: error
          retention-days: 30
      - name: Stop owned test container
        if: always()
        run: docker rm -f roster-portability
