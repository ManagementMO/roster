packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  sqlite-vec: true
  "@huggingface/transformers": true
# Upstream dependency ranges still resolve vulnerable releases. Keep the first
# safe compatible Hono release and the patched Transformers transitives pinned
# until their parents select them directly.
overrides:
  "@hono/node-server": 2.0.10
  adm-zip: 0.6.0
  sharp: 0.35.0
